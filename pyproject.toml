[project]
name = "protocolledger"
version = "0.0.1"
description = "Evidence-linked extraction and review of actions, materials, quantities and conditions in lab protocols."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "prometheus-client>=0.21",
    "python-crfsuite>=0.9.10",
    "scikit-learn>=1.5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
neural = [
    "torch>=2.6",
    "transformers>=4.46",
    "mlflow-skinny>=2.17",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
]

# Minimal set for serving a span-relation bundle (PyTorch FP32 on CPU).
serve-neural = [
    "torch>=2.6",
    "transformers>=4.46",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protocolledger"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Unit and symbol variants (×, −, –, µ, °) are the subject matter of this module.
"src/protocolledger/values.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_values.py" = ["RUF001", "RUF002", "RUF003"]
"src/protocolledger/eval/robustness.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_robustness.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pycrfsuite", "pycrfsuite.*", "sklearn", "sklearn.*", "mlflow", "mlflow.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: needs the full downloaded corpus or heavy compute; excluded from CI",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
