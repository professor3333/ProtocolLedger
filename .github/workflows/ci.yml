name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install (CPU-only PyTorch for the neural extra)
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Type check
        run: uv run mypy src/
      - name: Tests
        run: uv run pytest -m "not slow"
      - name: Frontend syntax
        run: node --check src/protocolledger/serve/static/app.js
      - name: Compose file is valid
        run: >
          PROTOCOLLEDGER_IMAGE=protocolledger:ci PROTOCOLLEDGER_MODEL_VERSION=fixture
          PROTOCOLLEDGER_BUNDLES_DIR=/tmp/bundles
          docker compose -f deploy/compose.yaml config --quiet
      - name: Build image
        run: docker build -t protocolledger:ci .
      - name: Container smoke test (fixture bundle)
        run: |
          uv run python scripts/make_fixture_bundle.py /tmp/bundles/fixture
          docker run -d --name pl-ci -p 127.0.0.1:8001:8000 -v /tmp/bundles:/models:ro \
            -e PROTOCOLLEDGER_BUNDLE=/models/fixture protocolledger:ci
          for i in $(seq 1 60); do curl -sf localhost:8001/readyz >/dev/null && break; sleep 1; done
          uv run python scripts/smoke_test.py --base-url http://127.0.0.1:8001 --expect-model-version fixture
      - name: Container logs on failure
        if: failure()
        run: docker logs pl-ci || true
